# Codecov upload policy for hsquared.
# Presence of this file does not prove coverage ran, uploaded, or was accepted.
# See docs/dev-log/dashboard/test-coverage.md.
#
# Two CI coverage jobs upload two reports (`ubuntu-covr`, `ubuntu-covr-julia`).
# Codecov merges line coverage across flags on the same commit. Do not add a
# third upload without raising `after_n_builds` and assigning a distinct flag.
codecov:
  require_ci_to_pass: false
  notify:
    after_n_builds: 2
    wait_for_ci: false

comment:
  layout: "header, diff, files"
  behavior: default
  require_changes: false

coverage:
  status:
    project:
      default:
        informational: true
    patch:
      default:
        informational: true

ignore:
  - "tests/**/*"
  - "vignettes/**/*"
  - "data-raw/**/*"
  - "dev-test/**/*"
  - "docs/**/*"
  - "sim/**/*"
  - "tools/**/*"
  - "man/**/*"
  - "inst/**/*"
