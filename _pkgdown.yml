url: https://itchyshin.github.io/hsquared/
destination: pkgdown-site

# D-41: prominent site-wide EXPERIMENTAL callout on the home sidebar (channel 3).
home:
  title: How much is genetic?
  description: >-
    Experimental 0.8.0 R interface for a Julia-backed animal model.
    public_covered_count is 7. Not production / not CRAN / 0.9 is not
    released. Fitting needs a local Julia and an HSquared.jl checkout.
    Report point estimates only for covered routes.
  sidebar:
    structure: [experimental, links, license, community, citation, authors, dev]
    components:
      # D-41 channel 3 stays, but as the SHORT form. The full statement
      # (experimental 0.8.0 / not production / not CRAN / 0.9 not released /
      # needs a local Julia) is said once, in the body callout a few
      # centimetres to the left of this card; repeating it verbatim here put
      # the same paragraph on screen twice, which is the craft defect the
      # 2026-09-06 sister-bar review flagged. Every fact unique to this card —
      # the planned/partial rows, the registry status, both evidence links —
      # is kept. Nothing was removed from the page, only from the second copy.
      experimental:
        title: Status
        text: >-
          **Experimental 0.8.0.** Version tracks covered capability, not
          surface area. `public_covered_count` is **7**. Factor-analytic G
          stays **planned** on R; single-step stays **opt-in partial**.
          Julia engine-covered ≠ R covered, and interval coverage is not
          certified. Not in the Julia General registry — registration
          ([PR #166969](https://github.com/JuliaRegistries/General/pull/166969))
          is deferred pending collaborator review, so do not use
          `Pkg.add("HSquared")` by name. Read
          [Can I fit and report this?](articles/current-limits.html)
          and [Validation evidence](articles/validation-evidence.html)
          before reporting results.

# Do not add a ROADMAP.html redirect. The pkgdown workflow hides
# AGENTS.md / CLAUDE.md / ROADMAP.md, then verifies those HTML pages
# are absent from the site, search.json, and sitemap.xml. A redirect
# recreates ROADMAP.html and fails that gate (2026-09-02 main red
# after #141). Send readers to articles/current-limits.html instead.

template:
  bootstrap: 5
  bootswatch: flatly
  includes:
    # pkgdown already prints the plain version beside the brand; the pill adds
    # the status word, not a second copy of the number.
    before_navbar: '<span class="hsquared-version-note">experimental</span>'
  bslib:
    # Deeper teal navbar matching the drmTMB/gllvmTMB sister packages.
    # Body ink is not the brand hue; link teal remains AA-safe on white.
    bg: "#ffffff"
    fg: "#112638"
    primary: "#0f7887"
    secondary: "#37515a"
    headings-color: "#112638"
    link-color: "#0f7887"
    link-hover-color: "#0a617d"
    border-color: "#d6e3e6"
  # HEX R-package lockup; keep the visual identity R/sister teal, never Julia
  # RGBP. man/figures/logo.svg is the single mark: pkgdown 2.2 find_logo()
  # prefers it, and it renders exactly once per page (the home page header).
  # The navbar is text-only — see pkgdown/templates/navbar.html.
  # Repository-local figure assets are the public source of this mark.
  opengraph:
    image:
      src: man/figures/logo.png
      alt: "hsquared hex logo: a pedigree and h squared, dark teal (proposed mark)"

