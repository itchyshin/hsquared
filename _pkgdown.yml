url: https://itchyshin.github.io/hsquared/
destination: pkgdown-site

# D-41: prominent site-wide EXPERIMENTAL callout on the home sidebar (channel 3).
home:
  sidebar:
    structure: [experimental, links, license, community, citation, authors, dev]
    components:
      experimental:
        title: Status
        text: >-
          **Experimental — use at your own risk.** Version tracks covered
          capability, not surface area. Interval coverage is not certified.
          Read [Can I fit and report this?](articles/current-limits.html)
          and [Validation evidence](articles/validation-evidence.html)
          before reporting results.

redirects:
  - ["ROADMAP.html", "articles/current-limits.html"]

template:
  bootstrap: 5
  bslib:
    bg: "#ffffff"
    fg: "#0f2533"
    primary: "#0284c7"
    secondary: "#475569"
    headings-color: "#082f49"
    link-color: "#0369a1"
    link-hover-color: "#075985"
    border-color: "#bae6fd"

navbar:
  structure:
    left: [intro, model_guides, status, comparators, developer, reference, news]
    right: [search, github]
  components:
    intro:
      text: Get started
      menu:
        - text: Getting started with hsquared
          href: articles/hsquared.html
        - text: Can I fit and report this?
          href: articles/current-limits.html
        - text: Function map and cheat sheet
          href: articles/function-map-cheatsheet.html
        - text: Worked example (gryphon)
          href: articles/gryphon-worked-example.html
    model_guides:
      text: Model guides
      menu:
        - text: Fitting models
          href: articles/fitting-models.html
        - text: Visualizing models
          href: articles/visualizing-models.html
        - text: Multivariate Gaussian animal models
          href: articles/multivariate.html
        - text: Genomic prediction
          href: articles/genomic-prediction.html
        - text: Reading G matrices
          href: articles/g-matrix-interpretation.html
    status:
      text: Status
      menu:
        - text: Can I fit and report this?
          href: articles/current-limits.html
        - text: Model status
          href: articles/model-status.html
        - text: Validation evidence
          href: articles/validation-evidence.html
        - text: QTL, GWAS, and eQTL status
          href: articles/qtl-gwas-eqtl-status.html
    comparators:
      text: Comparators
      menu:
        - text: "Benchmark: sommer & pedigreemm"
          href: articles/benchmark-comparators.html
        - text: "Two-effect model: sommer comparator"
          href: articles/two-effect-comparator.html
        - text: "Multi-effect model: sommer comparator"
          href: articles/multi-effect-comparator.html
        - text: "Random regression (k = 2): sommer comparator"
          href: articles/rr-comparator.html
    developer:
      text: Developer
      menu:
        - text: Formula grammar roadmap
          href: articles/formula-grammar.html
        - text: Inheritance systems roadmap
          href: articles/inheritance-systems.html
        - text: Genomics and GPU roadmap
          href: articles/genomics-gpu-roadmap.html

reference:
  - title: Start here
    desc: Current parser entry points and planned fitting controls.
    contents:
      - hs_data
      - data_status
      - hsquared
      - hs_control
      - backend_info
      - formula_status
      - validation_status
      - model_spec
      - animal
      - genomic_markers
      - qg_effect_markers
  - title: Extractor contract
    desc: Extractors for fitted `hsquared_fit` objects. The default `hsquared()` call fits the v0.1 Gaussian animal model; repeatability, two-effect, genomic, SNP-BLUP, multivariate, and random-regression outputs come from opt-in experimental targets.
    contents:
      - variance_components
      - heritability
      - heritability_interval
      - variance_component_standard_errors
      - multivariate_extractors
      - covariance_standard_errors
      - covariance_structure_lrt
      - gamma_matrix
      - metafounder_groups
      - metafounder_effects
      - factor_g_extractors
      - g_matrix_geometry
      - breeding_values
      - repeatability
      - repeatability_interval
      - permanent_effects
      - common_env_effects
      - maternal_effects
      - common_env_proportion
      - maternal_proportion
      - common_env_proportion_interval
      - direct_maternal_extractors
      - direct_heritability
      - total_heritability
      - direct_variance
      - partner_variance
      - direct_maternal_covariance
      - random_regression_extractors
      - prediction_error_variance
      - reliability
      - fit_diagnostics
      - plot.hsquared_fit
      - inference_blocks
      - marker_extractors
      - gwas
      - fixef
      - ranef
      - response_scale_methods
  - title: Visualization
    contents:
      - hsquared-autoplot
      - theme_hsquared
      - hs_recovery_forest
  - title: Package
    contents:
      - hsquared-package

articles:
  - title: Get started
    desc: >
      Start with the overview, then read current limits before fitting or
      reporting.
    contents:
      - hsquared
      - articles/current-limits
      - articles/function-map-cheatsheet
      - articles/gryphon-worked-example

  - title: Model guides
    desc: >
      Fitting, visualization, and interpretation guides. Multivariate, genomic,
      and G-matrix routes are opt-in experimental unless validation_status()
      marks them covered.
    contents:
      - articles/fitting-models
      - articles/visualizing-models
      - articles/multivariate
      - articles/genomic-prediction
      - articles/g-matrix-interpretation

  - title: Status
    desc: >
      Capability limits, validation evidence, and model-family status. Read these
      before reporting point estimates or intervals.
    contents:
      - articles/current-limits
      - articles/model-status
      - articles/validation-evidence
      - articles/qtl-gwas-eqtl-status

  - title: Comparators
    desc: >
      External comparator evidence against sommer and pedigreemm. Comparator
      agreement does not certify interval coverage.
    contents:
      - articles/benchmark-comparators
      - articles/two-effect-comparator
      - articles/multi-effect-comparator
      - articles/rr-comparator

  - title: Developer
    desc: >
      Formula grammar, inheritance systems, and genomics roadmaps. Planned
      capability — not covered for fitting or reporting today.
    contents:
      - articles/formula-grammar
      - articles/inheritance-systems
      - articles/genomics-gpu-roadmap
