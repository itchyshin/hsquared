url: https://itchyshin.github.io/hsquared/
destination: pkgdown-site

# D-41: prominent site-wide EXPERIMENTAL callout on the home sidebar (channel 3).
home:
  title: How much is genetic?
  description: >-
    Experimental 0.8.0 R interface for a Julia-backed animal model.
    public_covered_count is 7. Not production / not CRAN / 0.9 is not
    released. Fitting needs a local Julia and an HSquared.jl checkout.
    Report point estimates only for covered routes.
  sidebar:
    structure: [experimental, links, license, community, citation, authors, dev]
    components:
      experimental:
        title: Status
        text: >-
          **Experimental 0.8.0 — not production / not CRAN / 0.9 is not
          released.** Version tracks covered capability, not surface area.
          `public_covered_count` is **7**. Factor-analytic G stays **planned**
          on R; single-step stays **opt-in partial**. Julia engine-covered ≠
          R covered. Interval coverage is not certified. Julia General
          registration
          ([PR #166969](https://github.com/JuliaRegistries/General/pull/166969))
          is deferred pending collaborator review; do not use
          `Pkg.add("HSquared")` by name. Read
          [Can I fit and report this?](articles/current-limits.html)
          and [Validation evidence](articles/validation-evidence.html)
          before reporting results.

# Do not add a ROADMAP.html redirect. The pkgdown workflow hides
# AGENTS.md / CLAUDE.md / ROADMAP.md, then verifies those HTML pages
# are absent from the site, search.json, and sitemap.xml. A redirect
# recreates ROADMAP.html and fails that gate (2026-09-02 main red
# after #141). Send readers to articles/current-limits.html instead.

template:
  bootstrap: 5
  bootswatch: flatly
  includes:
    before_navbar: '<span class="hsquared-version-note">0.8.0 experimental</span>'
  bslib:
    # Deeper teal navbar (drmTMB/gllvmTMB sister). Body ink is NOT the brand
    # hue. Link teal is the darkened AA 4.5:1 sibling (#0B7C7C); logo teals
    # #12A3A3 / #0F8E8E fail on white (BRAIN-NOTES 2026-09-06).
    bg: "#ffffff"
    fg: "#112638"
    primary: "#12141A"
    secondary: "#37515a"
    headings-color: "#112638"
    link-color: "#0B7C7C"
    link-hover-color: "#0a5f5f"
    border-color: "#c5d6d6"
  # HEX PROPOSAL v2 pending Shinichi pick.
  # Navbar / favicon / opengraph: man/figures/logo.svg + logo.png (no wordmark).
  # Home hero: man/figures/sticker.svg + sticker.png (wordmark lockup).
  # Installed from ~/local-scratch/h2-09-finish-docs-brand/hex/hsquared/.
  # pkgdown 2.2 find_logo() prefers logo.svg — that stays the navbar mark.
  opengraph:
    image:
      src: man/figures/logo.png
      alt: "hsquared hex logo (PROPOSAL)"

navbar:
  structure:
    left: [intro, model_guides, status, comparators, developer, reference, news]
    right: [search, github]
  components:
    intro:
      text: Get started
      menu:
        - text: Getting started with hsquared
          href: articles/hsquared.html
        - text: Can I fit and report this?
          href: articles/current-limits.html
        - text: Function map and cheat sheet
          href: articles/function-map-cheatsheet.html
        - text: Worked example (gryphon)
          href: articles/gryphon-worked-example.html
    model_guides:
      text: Model guides
      menu:
        - text: Fitting models
          href: articles/fitting-models.html
        - text: Visualizing models
          href: articles/visualizing-models.html
        - text: Multivariate Gaussian animal models
          href: articles/multivariate.html
    status:
      text: Status
      menu:
        - text: Twin boundary (R public vs Julia engine)
          href: articles/twin-boundary.html
        - text: Can I fit and report this?
          href: articles/current-limits.html
        - text: Model status
          href: articles/model-status.html
        - text: Validation evidence
          href: articles/validation-evidence.html
    comparators:
      text: Comparators
      menu:
        - text: "Benchmark: sommer & pedigreemm"
          href: articles/benchmark-comparators.html
        - text: "Two-effect model: sommer comparator"
          href: articles/two-effect-comparator.html
        - text: "Multi-effect model: sommer comparator"
          href: articles/multi-effect-comparator.html
        - text: "Random regression (k = 2): sommer comparator"
          href: articles/rr-comparator.html
    developer:
      text: Developer
      menu:
        - text: Formula grammar roadmap
          href: articles/formula-grammar.html
        - text: Inheritance systems roadmap
          href: articles/inheritance-systems.html
        - text: Genomics and GPU roadmap
          href: articles/genomics-gpu-roadmap.html
        - text: "---------"
        - text: Genomic prediction
          href: articles/genomic-prediction.html
        - text: Reading G matrices
          href: articles/g-matrix-interpretation.html
        - text: QTL, GWAS, and eQTL status
          href: articles/qtl-gwas-eqtl-status.html

reference:
  - title: Start here
    desc: >
      Live verbs for the default job: one Gaussian trait, one animal term,
      REML. Read current limits before reporting.
    contents:
      - hsquared
      - hs_data
      - hs_control
      - animal
      - model_spec
      - formula_status
      - validation_status
      - data_status
      - backend_info
  - title: Core extractors
    desc: >
      What you read off a fitted univariate Gaussian animal model — the covered
      default route. Read `fit_diagnostics()` (especially `at_boundary`) before
      reporting anything else.
    contents:
      - variance_components
      - heritability
      - breeding_values
      - prediction_error_variance
      - reliability
      - fixef
      - ranef
      - fit_diagnostics
      - response_scale_methods
  - title: Repeatability and independent extra effects
    desc: >
      Outputs of the opt-in `repeatability`, `two_effect`, and `multi_effect`
      targets. The common-environment and arbitrary-N legs are covered; the
      repeatability and maternal-genetic legs are experimental. Non-animal blocks
      report variance-explained proportions, not heritabilities.
    contents:
      - repeatability
      - permanent_effects
      - common_env_effects
      - maternal_effects
      - common_env_proportion
      - maternal_proportion
  - title: Direct–maternal and random regression
    desc: >
      Outputs of the opt-in `direct_maternal` and `random_regression` targets, both
      covered at validation scale (k = 2 only for random regression). Direct h² is
      not total heritability; `heritability()` returns the labelled Willham triple
      for direct–maternal fits.
    contents:
      - direct_maternal_extractors
      - direct_heritability
      - total_heritability
      - direct_variance
      - partner_variance
      - direct_maternal_covariance
      - random_regression_extractors
  - title: Visualization
    desc: >
      Figures carry a machine-readable `hsquared_meta` honest-status attribute.
      Uncertainty displays are not calibrated-precision statements.
    contents:
      - hsquared-autoplot
      - plot.hsquared_fit
      - theme_hsquared
      - hs_recovery_forest
  - title: Uncertainty (experimental)
    desc: >
      Asymptotic/delta-method standard errors, intervals, and tests, surfaced when
      the engine provides them. **Not coverage-calibrated** — no route carries an
      interval-reporting permission. `confint()` and `vcov()` are deliberately
      absent rather than shipped uncalibrated.
    contents:
      - heritability_interval
      - variance_component_standard_errors
      - covariance_standard_errors
      - covariance_structure_lrt
      - repeatability_interval
      - common_env_proportion_interval
      - inference_blocks
  - title: Multivariate (experimental)
    desc: >
      Outputs of the opt-in `multivariate` and `metafounder` targets.
      Experimental: REML-only, animal-model-only, dense/validation-scale.
    contents:
      - multivariate_extractors
      - gamma_matrix
      - metafounder_groups
      - g_matrix_geometry
  - title: Reserved syntax
    desc: >
      Formula markers the parser recognises so it can name the planned or
      opt-in path. They are not a finished genomic, QTL, or inheritance system.
    contents:
      - genomic_markers
      - qg_effect_markers
  - title: Reserved extractors
    desc: >
      Names reserved so help pages exist. Most currently error. `gwas()` is an
      experimental post-fit scan, not a formula-level QTL workflow.
    contents:
      - metafounder_effects
      - factor_g_extractors
      - marker_extractors
      - gwas
  - title: Package
    contents:
      - hsquared-package

articles:
  - title: Get started
    desc: >
      Start with the overview, then read current limits before fitting or
      reporting.
    contents:
      - hsquared
      - articles/current-limits
      - articles/function-map-cheatsheet
      - articles/gryphon-worked-example

  - title: Model guides
    desc: >
      Fitting and visualization for the animal-model path. Multivariate is
      opt-in experimental. Genomic prediction and G-matrix pages live under
      Developer until those routes are covered.
    contents:
      - articles/fitting-models
      - articles/visualizing-models
      - articles/multivariate

  - title: Status
    desc: >
      Capability limits, validation evidence, and model-family status. Read these
      before reporting point estimates or intervals.
    contents:
      - articles/twin-boundary
      - articles/current-limits
      - articles/model-status
      - articles/validation-evidence

  - title: Comparators
    desc: >
      External comparator evidence against sommer and pedigreemm. Comparator
      agreement does not certify interval coverage.
    contents:
      - articles/benchmark-comparators
      - articles/two-effect-comparator
      - articles/multi-effect-comparator
      - articles/rr-comparator

  - title: Developer
    desc: >
      Formula grammar, inheritance systems, and genomics roadmaps, plus
      specialist genomic / G-matrix / QTL status pages. Planned or experimental
      capability — not the default reporting path.
    contents:
      - articles/formula-grammar
      - articles/inheritance-systems
      - articles/genomics-gpu-roadmap
      - articles/genomic-prediction
      - articles/g-matrix-interpretation
      - articles/qtl-gwas-eqtl-status
