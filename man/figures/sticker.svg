<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
  <title id="title">hsquared</title>
  <desc id="desc">R hex sticker: dark teal field, gold pedigree, white h-squared and package name. Transparent outside the hex.</desc>
  <defs>
    <linearGradient id="fill" x1="200" y1="80" x2="980" y2="1120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0c4550"/>
      <stop offset="55%" stop-color="#07343d"/>
      <stop offset="100%" stop-color="#041f26"/>
    </linearGradient>
    <linearGradient id="name" x1="400" y1="900" x2="800" y2="980" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#e8fffc"/>
      <stop offset="100%" stop-color="#7ed8d0"/>
    </linearGradient>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="18" stdDeviation="14" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <!-- pointy-top hex (R sticker convention) -->
    <path id="hex" d="M600 70 L1010 310 L1010 790 L600 1030 L190 790 L190 310 Z"/>
  </defs>

  <use href="#hex" fill="url(#fill)" filter="url(#shadow)"/>
  <use href="#hex" fill="none" stroke="#f7fbfb" stroke-width="34" stroke-linejoin="round"/>
  <path d="M600 108 L970 330 L970 770 L600 992 L230 770 L230 330 Z" fill="none" stroke="#3fd0c9" stroke-width="5" stroke-linejoin="round" opacity="0.95"/>

  <!-- pedigree: two parents → mid → two offspring (true pedigree, not a Y) -->
  <g stroke-linecap="round" stroke-linejoin="round">
    <path d="M420 300 H780" stroke="#f3d78a" stroke-width="9"/>
    <path d="M600 300 V400" stroke="#f3d78a" stroke-width="9"/>
    <path d="M420 480 H780" stroke="#f3d78a" stroke-width="9"/>
    <path d="M600 400 V480" stroke="#f3d78a" stroke-width="9"/>
    <path d="M420 300 H780" stroke="#fff6d0" stroke-width="2.5" opacity="0.55"/>
    <path d="M600 300 V480" stroke="#fff6d0" stroke-width="2.5" opacity="0.55"/>
    <path d="M420 480 H780" stroke="#fff6d0" stroke-width="2.5" opacity="0.55"/>

    <circle cx="420" cy="300" r="42" fill="#e2bc4e" stroke="#fff8e6" stroke-width="6"/>
    <circle cx="780" cy="300" r="42" fill="#c9923a" stroke="#fff8e6" stroke-width="6"/>
    <circle cx="420" cy="480" r="42" fill="#5ec9c0" stroke="#e9fffc" stroke-width="6"/>
    <circle cx="780" cy="480" r="42" fill="#8edfd7" stroke="#e9fffc" stroke-width="6"/>
  </g>

  <text x="600" y="700" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="800" font-size="200" fill="#ffffff" letter-spacing="-4">h²</text>
  <text x="600" y="900" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="800" font-size="92" fill="url(#name)">hsquared</text>
</svg>
