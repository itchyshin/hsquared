<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
  <title id="title">hsquared hex logo (PROPOSAL v3 R)</title>
  <desc id="desc">Dark teal R-sister hex with a gold pedigree, white h-squared, and the name hsquared. Not Julia-branded.</desc>
  <defs>
    <linearGradient id="hexFill" x1="230" y1="150" x2="970" y2="1050" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0a3d46"/>
      <stop offset="0.55" stop-color="#07343d"/>
      <stop offset="1" stop-color="#05272f"/>
    </linearGradient>
    <linearGradient id="nameGrad" x1="420" y1="880" x2="780" y2="980" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#9fe8e2"/>
      <stop offset="1" stop-color="#5ecfc8"/>
    </linearGradient>
    <linearGradient id="h2Grad" x1="480" y1="520" x2="720" y2="700" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d7f6f3"/>
    </linearGradient>
    <clipPath id="hexClip">
      <path d="M600 44 1058 322v556L600 1156 142 878V322Z"/>
    </clipPath>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="12" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
    <filter id="textShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="4" dy="8" stdDeviation="1.2" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- Outer hex — drmTMB craft: dark teal field, ice rim, inner cyan hairline -->
  <path d="M600 44 1058 322v556L600 1156 142 878V322Z" fill="url(#hexFill)" filter="url(#softShadow)"/>
  <path d="M600 44 1058 322v556L600 1156 142 878V322Z" fill="none" stroke="#f8fbfb" stroke-width="28" stroke-linejoin="round"/>
  <path d="M600 82 1028 342v516L600 1118 172 858V342Z" fill="none" stroke="#46d6d6" stroke-width="4.5" stroke-linejoin="round"/>

  <g clip-path="url(#hexClip)">
    <!-- Soft contour lines like sister hex atmosphere -->
    <g fill="none" stroke="#4aa0a6" stroke-width="1.3" opacity="0.22">
      <path d="M160 260 C320 248 470 255 600 268 C740 282 900 250 1060 262"/>
      <path d="M150 340 C310 325 480 335 620 348 C760 360 900 340 1065 352"/>
      <path d="M155 880 C320 900 470 885 620 872 C780 858 920 880 1060 895"/>
    </g>

    <!-- Pedigree: gold/cream on teal — heritability, not Julia RGBP -->
    <g stroke-linecap="round" stroke-linejoin="round">
      <!-- edges -->
      <path d="M420 310 L600 430 L780 310" fill="none" stroke="#f0d58a" stroke-width="10" opacity="0.95"/>
      <path d="M600 430 L600 545" fill="none" stroke="#f0d58a" stroke-width="10" opacity="0.95"/>
      <!-- highlight -->
      <path d="M420 310 L600 430 L780 310" fill="none" stroke="#fff4c8" stroke-width="3.2" opacity="0.7"/>
      <path d="M600 430 L600 545" fill="none" stroke="#fff4c8" stroke-width="3.2" opacity="0.7"/>

      <!-- nodes: warm gold / soft teal only -->
      <circle cx="420" cy="310" r="38" fill="#e8c15a" stroke="#fff8e0" stroke-width="5"/>
      <circle cx="780" cy="310" r="38" fill="#d4a84a" stroke="#fff8e0" stroke-width="5"/>
      <circle cx="600" cy="430" r="34" fill="#7ed8d0" stroke="#e8fffc" stroke-width="5"/>
      <circle cx="600" cy="545" r="40" fill="#f2d57a" stroke="#fff8e0" stroke-width="5"/>
    </g>

    <!-- h² -->
    <g font-family="Arial, Helvetica, sans-serif" font-weight="800" text-anchor="middle" filter="url(#textShadow)">
      <text x="600" y="720" fill="url(#h2Grad)" font-size="168" letter-spacing="-2">h²</text>
    </g>

    <!-- package name -->
    <g font-family="Arial, Helvetica, sans-serif" font-weight="800" text-anchor="middle" filter="url(#textShadow)">
      <text x="600" y="920" fill="#f8fbfb" font-size="108">hsquared</text>
      <text x="600" y="920" fill="url(#nameGrad)" font-size="108" opacity="0.35">hsquared</text>
    </g>
  </g>
</svg>
