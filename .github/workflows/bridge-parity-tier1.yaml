# Tier 1 optional bridge parity (doc-41 §3 criterion 8).
# workflow_dispatch ONLY — not on pull_request / push.
# Prerequisite: hs_require_bridge() + HSQUARED_REQUIRE_BRIDGE=true so a failed
# Julia provision cannot skip-as-pass. Stub
# bridge-parity-tier1.stub.yaml stays if: false and must not be flipped.
name: bridge-parity (Tier 1)

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bridge-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      NOT_CRAN: true
      HSQUARED_JULIA_TESTS: true
      # Turns a would-be skip into a hard failure. Without this the job
      # goes green with the parity legs absent.
      HSQUARED_REQUIRE_BRIDGE: true

    steps:
      - uses: actions/checkout@v4

      - name: Checkout the engine twin
        uses: actions/checkout@v4
        with:
          repository: itchyshin/HSquared.jl
          ref: main
          path: HSquared.jl

      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.10'

      - uses: julia-actions/cache@v2

      - name: Instantiate the engine project
        run: julia --project=HSquared.jl -e 'using Pkg; Pkg.instantiate(); using HSquared'

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::JuliaCall, any::devtools, any::nadiv
          needs: check

      - name: Element-wise bridge parity (A26)
        env:
          HSQUARED_JULIA_PROJECT: ${{ github.workspace }}/HSquared.jl
        run: |
          Rscript -e '
            suppressMessages(devtools::load_all("."))
            stopifnot(hsquared:::hs_julia_bridge_available())
            res <- as.data.frame(testthat::test_file(
              "tests/testthat/test-multivariate-engine-parity.R",
              reporter = "summary"
            ))
            cat("pass", sum(res$passed), "fail", sum(res$failed),
                "skip", sum(res$skipped), "\n")
            stopifnot(
              sum(res$failed) == 0,
              sum(res$skipped) == 0,
              sum(res$passed) >= 44L
            )
          '
